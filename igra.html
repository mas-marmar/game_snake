<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Змiйка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }

  h1 {
    margin-bottom: 15px;
    color: #4ade80;
    letter-spacing: 2px;
  }

  #hud {
    font-size: 20px;
    margin-bottom: 10px;
    display: flex;
    gap: 30px;
  }

  #gameWrapper {
    position: relative;
  }

  canvas {
    background: #0f0f1e;
    border: 3px solid #4ade80;
    border-radius: 10px;
    display: block;
    box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }

  #overlay.show { display: flex; }

  #overlay h2 {
    color: #ef4444;
    font-size: 36px;
    margin-bottom: 15px;
  }

  #overlay p {
    font-size: 20px;
    margin-bottom: 20px;
  }

  #overlay button {
    background: #4ade80;
    color: #1a1a2e;
    border: none;
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }

  #overlay button:hover {
    background: #22c55e;
    transform: scale(1.05);
  }

  #hint {
    margin-top: 15px;
    font-size: 14px;
    color: #888;
    text-align: center;
  }

  .mobile-controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 8px;
  }

  .mobile-controls button {
    background: #2a2a4a;
    color: #4ade80;
    border: 2px solid #4ade80;
    border-radius: 10px;
    font-size: 24px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .mobile-controls button:active {
    background: #4ade80;
    color: #1a1a2e;
  }

  .mobile-controls .up    { grid-column: 2; grid-row: 1; }
  .mobile-controls .left  { grid-column: 1; grid-row: 2; }
  .mobile-controls .down  { grid-column: 2; grid-row: 2; }
  .mobile-controls .right { grid-column: 3; grid-row: 2; }

  @media (min-width: 700px) {
    .mobile-controls { display: none; }
  }
</style>
</head>
<body>

<h1>🐍 ЗМЕЙКА 🐍</h1>
<div id="hud">
  <div>Счёт: <span id="scoreVal">0</span></div>
  <div>Бонусы: <span id="bonusVal">0</span></div>
</div>

<div id="gameWrapper">
  <canvas id="game" width="600" height="600"></canvas>
  <div id="overlay">
    <h2>Игра окончена</h2>
    <p id="finalScore">Счёт: 0</p>
    <button onclick="restart()">Играть снова</button>
  </div>
</div>

<div id="hint">← ↑ → ↓ / WASD — движение &nbsp;|&nbsp; Пробел — пауза &nbsp;|&nbsp; 🍎 +1 &nbsp; 💎 +5 &nbsp;|&nbsp;</div>

<div class="mobile-controls">
  <button class="up"    onclick="setDirection(0,-1)">▲</button>
  <button class="left"  onclick="setDirection(-1,0)">◀</button>
  <button class="down"  onclick="setDirection(0,1)">▼</button>
  <button class="right" onclick="setDirection(1,0)">▶</button>
</div>

<script>
// ---------- Настройки ----------
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const CELL   = 20;
const COLS   = canvas.width  / CELL;   // 30
const ROWS   = canvas.height / CELL;   // 30

const scoreEl    = document.getElementById('scoreVal');
const bonusEl    = document.getElementById('bonusVal');
const overlay    = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');

// ⚙️ Скорость игры
const START_SPEED = 180;
const MIN_SPEED   = 90;
const SPEED_STEP  = 2;

// 💎 Настройки движущейся цели
const BONUS_LIFETIME = 7000;
const BONUS_COOLDOWN = 2500;
const BONUS_MOVE_MS  = 300;

// ---------- Состояние ----------
let snake, direction, nextDirection, food, score, bonusScore, speed;
let lastMoveTime, gameOver, paused, started;

let bonus;
let bonusNextSpawn;

// 🌀 Эффекты телепортации (для визуальной вспышки)
let teleportEffects = [];

function initGame() {
  snake = [{x: 10, y: 10}];
  direction     = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  bonusScore = 0;
  speed = START_SPEED;
  lastMoveTime = 0;
  gameOver = false;
  paused   = false;
  started  = false;

  bonus = null;
  bonusNextSpawn = performance.now() + 3000;
  teleportEffects = [];

  placeFood();
  scoreEl.textContent = '0';
  bonusEl.textContent = '0';
  overlay.classList.remove('show');
}

function placeFood() {
  while (true) {
    const pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
        (!bonus || bonus.x !== pos.x || bonus.y !== pos.y)) {
      food = pos;
      return;
    }
  }
}

// ---------- Движущаяся цель ----------
function spawnBonus() {
  let x, y, tries = 0;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
    tries++;
  } while (
    tries < 100 && (
      snake.some(s => s.x === x && s.y === y) ||
      (food.x === x && food.y === y) ||
      Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < 5
    )
  );

  const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  const d = dirs[Math.floor(Math.random() * dirs.length)];

  bonus = {
    x, y,
    dirX: d.x, dirY: d.y,
    expiresAt: performance.now() + BONUS_LIFETIME,
    lastStep: performance.now()
  };
}

function updateBonus(now) {
  if (!bonus) {
    if (now >= bonusNextSpawn) spawnBonus();
    return;
  }

  if (now >= bonus.expiresAt) {
    bonus = null;
    bonusNextSpawn = now + BONUS_COOLDOWN;
    return;
  }

  if (now - bonus.lastStep >= BONUS_MOVE_MS) {
    bonus.lastStep = now;

    let nx = bonus.x + bonus.dirX;
    let ny = bonus.y + bonus.dirY;

    // 🌀 Бонус тоже телепортируется через стены!
    if (nx < 0) nx = COLS - 1;
    if (nx >= COLS) nx = 0;
    if (ny < 0) ny = ROWS - 1;
    if (ny >= ROWS) ny = 0;

    bonus.x = nx;
    bonus.y = ny;
  }
}

// ---------- Управление ----------
function setDirection(x, y) {
  if (direction.x === -x && direction.y === -y) return;
  nextDirection = {x, y};
  if (!started) started = true;
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (['arrowup','w'].includes(key))         setDirection(0, -1);
  else if (['arrowdown','s'].includes(key))  setDirection(0, 1);
  else if (['arrowleft','a'].includes(key))  setDirection(-1, 0);
  else if (['arrowright','d'].includes(key)) setDirection(1, 0);
  else if (e.code === 'Space' && !gameOver) {
    paused = !paused;
    e.preventDefault();
  }
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
    e.preventDefault();
  }
});

// ---------- Логика змейки ----------
function update() {
  if (gameOver || paused || !started) return;

  direction = nextDirection;

  let head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // 🌀 ТЕЛЕПОРТАЦИЯ через стены
  const oldX = head.x, oldY = head.y;

  if (head.x < 0)         head.x = COLS - 1;
  else if (head.x >= COLS) head.x = 0;

  if (head.y < 0)         head.y = ROWS - 1;
  else if (head.y >= ROWS) head.y = 0;

  // Если произошёл «прыжок» через стену — добавим визуальный эффект
  if (oldX !== head.x || oldY !== head.y) {
    // Эффект на входе (у старой позиции) и выходе (у новой)
    teleportEffects.push({
      x: oldX, y: oldY, // но oldX/oldY уже за пределами поля
      cellX: snake[0].x, cellY: snake[0].y,
      start: performance.now()
    });
    teleportEffects.push({
      cellX: head.x, cellY: head.y,
      start: performance.now()
    });
  }

  // ❌ Столкновение с собственным телом (единственная причина смерти!)
  // Проверяем с учётом того, что хвост сдвинется (если не едим)
  const willEatFood  = (head.x === food.x && head.y === food.y);
  const willEatBonus = bonus && (head.x === bonus.x && head.y === bonus.y);

  // Если не едим — хвост уйдёт, можно не проверять последний сегмент
  const bodyToCheck = (willEatFood || willEatBonus)
    ? snake
    : snake.slice(0, -1);

  if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (willEatFood) {
    score++;
    scoreEl.textContent = score;
    placeFood();
    speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
  }
  else if (willEatBonus) {
    score += 5;
    bonusScore++;
    scoreEl.textContent = score;
    bonusEl.textContent = bonusScore;
    bonus = null;
    bonusNextSpawn = performance.now() + BONUS_COOLDOWN;
    speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
  }
  else {
    snake.pop();
  }
}

function endGame() {
  gameOver = true;
  finalScore.textContent = `Счёт: ${score} (бонусов поймано: ${bonusScore})`;
  overlay.classList.add('show');
}

function restart() {
  initGame();
}

// ---------- Отрисовка ----------
function draw(now) {
  // Фон
  ctx.fillStyle = '#0f0f1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Сетка
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(canvas.width, y * CELL);
    ctx.stroke();
  }

  // 🌀 Портальные индикаторы по краям (подсказка, что стены телепортируют)
  drawPortalEdges(now);

  // 🍎 Яблоко
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(fx, fy, CELL / 2 - 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.arc(fx - 3, fy - 3, 2, 0, Math.PI * 2);
  ctx.fill();

  // 💎 Бонус
  if (bonus) drawBonus(bonus, now);

  // 🐍 Змейка
  snake.forEach((seg, i) => {
    const t = i / Math.max(snake.length - 1, 1);
    const r = Math.round(74  - 40 * t);
    const g = Math.round(222 - 100 * t);
    const b = Math.round(128 - 60 * t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;

    const pad = i === 0 ? 1 : 2;
    roundRect(
      seg.x * CELL + pad,
      seg.y * CELL + pad,
      CELL - pad * 2,
      CELL - pad * 2,
      5
    );

    if (i === 0) {
      ctx.fillStyle = '#0f0f1e';
      const cx = seg.x * CELL + CELL / 2;
      const cy = seg.y * CELL + CELL / 2;
      const ex = direction.x * 3;
      const ey = direction.y * 3;
      const perpX = -direction.y * 4;
      const perpY =  direction.x * 4;
      ctx.beginPath();
      ctx.arc(cx + ex + perpX, cy + ey + perpY, 2.2, 0, Math.PI * 2);
      ctx.arc(cx + ex - perpX, cy + ey - perpY, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 🌀 Эффекты телепортации
  drawTeleportEffects(now);

  // Пауза
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
    ctx.font = '20px Arial';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Нажми Пробел, чтобы продолжить',
                 canvas.width / 2, canvas.height / 2 + 40);
  }

  // Стартовая подсказка
  if (!started && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Нажми любую стрелку', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '18px Arial';
    ctx.fillStyle = '#94e2b5';

  }
}

// Портальные индикаторы по краям поля
function drawPortalEdges(now) {
  const pulse = 0.3 + 0.25 * Math.sin(now / 300);

  // Верх и низ
  for (let x = 0; x < COLS; x++) {
    const cx = x * CELL + CELL / 2;
    ctx.fillStyle = `rgba(74, 222, 128, ${pulse})`;
    ctx.fillRect(cx - 2, 0, 4, 3);
    ctx.fillRect(cx - 2, canvas.height - 3, 4, 3);
  }
  // Лево и право
  for (let y = 0; y < ROWS; y++) {
    const cy = y * CELL + CELL / 2;
    ctx.fillStyle = `rgba(74, 222, 128, ${pulse})`;
    ctx.fillRect(0, cy - 2, 3, 4);
    ctx.fillRect(canvas.width - 3, cy - 2, 3, 4);
  }
}

// Эффекты вспышки при телепортации
function drawTeleportEffects(now) {
  teleportEffects = teleportEffects.filter(e => now - e.start < 400);

  teleportEffects.forEach(e => {
    const age = (now - e.start) / 400;
    const alpha = 1 - age;
    const size = CELL * (0.4 + age * 0.9);

    const cx = e.cellX * CELL + CELL / 2;
    const cy = e.cellY * CELL + CELL / 2;

    ctx.strokeStyle = `rgba(74, 222, 128, ${alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, size, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawBonus(b, now) {
  const cx = b.x * CELL + CELL / 2;
  const cy = b.y * CELL + CELL / 2;

  const remaining = Math.max(0, b.expiresAt - now);
  const lifeRatio = remaining / BONUS_LIFETIME;

  const pulse = 1 + 0.15 * Math.sin(now / 120);
  const size  = (CELL / 2 - 1) * pulse;

  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * 1.5);
  glow.addColorStop(0, 'rgba(255, 215, 0, 0.55)');
  glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI / 4);
  const grad = ctx.createLinearGradient(-size, -size, size, size);
  grad.addColorStop(0, '#fff7a8');
  grad.addColorStop(0.5, '#ffd700');
  grad.addColorStop(1, '#b8860b');
  ctx.fillStyle = grad;
  ctx.fillRect(-size * 0.8, -size * 0.8, size * 1.6, size * 1.6);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = `rgba(255, 215, 0, ${0.3 + 0.5 * lifeRatio})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 1.1, -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * lifeRatio);
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
  ctx.fill();
}

// ---------- Главный цикл ----------
function loop(now) {
  if (!paused && !gameOver) {
    updateBonus(now);
    if (now - lastMoveTime >= speed) {
      update();
      lastMoveTime = now;
    }
  }
  draw(now);
  requestAnimationFrame(loop);
}

// ---------- Старт ----------
initGame();
requestAnimationFrame(loop);
</script>

</body>
</html>
